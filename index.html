<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f2f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="100">
<title>100 Push-Ups</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --color-bg:#f3f2f2;
  --color-surface:#eae9e9;
  --color-text:#201e1d;
  --color-accent:#ec3013;
  --color-divider:color-mix(in srgb,#201e1d 40%,transparent);
  --color-neutral-200:#eae7e7;
  --color-neutral-300:#d7d3d3;
  --color-neutral-400:#bab6b6;
  --color-neutral-600:#7d7979;
  --color-neutral-700:#605d5d;
  --color-neutral-800:#444141;
  --color-accent-600:#dd2b0f;
  --color-accent-700:#ae1800;
  --font:"Archivo",system-ui,-apple-system,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--color-bg);color:var(--color-text);font-family:var(--font);
  font-size:15px;line-height:1.55;font-weight:400;
  height:100vh;height:100dvh;overflow:hidden;
  display:flex;flex-direction:column;
}
button{font-family:var(--font);border-radius:0}
input{font-family:var(--font);border-radius:0}
a{color:var(--color-accent)}
:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px}
::selection{background:rgba(236,48,19,.18)}

.shell{
  width:100%;max-width:460px;margin:0 auto;
  display:flex;flex-direction:column;position:relative;overflow:hidden;
  background:var(--color-bg);
  height:100vh;height:100dvh;
  padding-top:env(safe-area-inset-top);
}

/* header */
.top{flex:none}
.top-row{
  display:flex;justify-content:space-between;align-items:baseline;gap:14px;
  min-width:0;padding:14px 20px 10px;
}
.wk{font-weight:800;font-size:13px;letter-spacing:.1em;text-transform:uppercase}
.daylbl{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--color-neutral-700)}
.rule2{height:2px;background:var(--color-divider)}
.rule1{height:1px;background:var(--color-divider)}

.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}

/* hero — the red 100 IS the log button */
.herobtn{
  display:block;width:100%;text-align:left;border:0;cursor:pointer;
  background:var(--color-accent);color:var(--color-bg);padding:24px 20px 26px;
}
.herobtn.late{background:var(--color-accent-700)}
.herobtn.done{background:var(--color-text);cursor:default}
.herobtn:active:not(.done){filter:brightness(.92)}
.kicker{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.big100{font-weight:800;font-size:120px;line-height:.78;letter-spacing:-.06em;margin-top:12px}
.herofoot{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-top:4px}
.subhead{font-weight:800;font-size:30px;line-height:1.05;letter-spacing:-.02em}
.heroact{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.9;padding-bottom:5px}

/* stat row */
.statrow{display:grid;grid-template-columns:repeat(3,1fr);border-top:2px solid var(--color-divider);border-bottom:2px solid var(--color-divider)}
.stat{padding:16px 20px}
.stat+.stat{padding:16px 0 16px 16px;border-left:2px solid var(--color-divider)}
.statlbl{font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--color-neutral-700)}
.statval{font-weight:800;font-size:26px;line-height:1;margin-top:5px}
.statval small{font-size:14px;font-weight:600;color:var(--color-neutral-600)}

.latebar{
  display:flex;align-items:center;gap:10px;padding:14px 20px;
  background:var(--color-neutral-200);border-bottom:1px solid var(--color-divider);
}
.latedot{width:10px;height:10px;flex:none;background:var(--color-accent)}
.lateline{font-size:13px;font-weight:600;line-height:1.4}
.donemeta{padding:14px 20px;border-bottom:1px solid var(--color-divider);font-size:12px;color:var(--color-neutral-700)}

/* sticky log slab — shown on Board/Group when today isn't logged */
.slabwrap{flex:none;border-top:2px solid var(--color-divider);background:var(--color-bg)}
.slabhint{padding:11px 20px 0;font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--color-neutral-700)}
.slab{
  display:flex;width:100%;align-items:center;justify-content:space-between;gap:12px;
  background:var(--color-accent);color:var(--color-bg);border:0;margin-top:10px;
  padding:22px 20px;cursor:pointer;font-weight:800;font-size:26px;
  letter-spacing:-.02em;text-align:left;
}
.slab.late{background:var(--color-accent-700)}
.slab:active{background:var(--color-accent-700)}
.slab .arrow{font-size:22px;font-weight:800}

/* undo bar */
.undobar{
  flex:none;background:var(--color-text);color:var(--color-bg);display:flex;
  align-items:center;justify-content:space-between;gap:12px;padding:0 0 0 20px;
}
.undotxt{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:14px 0}
.undobtn{
  background:var(--color-accent);color:var(--color-bg);border:0;padding:14px 18px;cursor:pointer;
  font-weight:800;font-size:12px;letter-spacing:.1em;text-transform:uppercase;
}

.gapline{padding:20px 20px 0;font-weight:800;font-size:19px;line-height:1.25;letter-spacing:-.01em}

.sechead{padding:22px 20px 8px;display:flex;align-items:baseline;gap:10px}
.sechead .t{font-weight:800;font-size:13px;letter-spacing:.1em;text-transform:uppercase}
.sechead .fill{flex:1;height:1px;background:var(--color-divider)}
.sechead .n{font-weight:800;font-size:13px;color:var(--color-accent-700)}

.prow{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 20px;border-top:1px solid var(--color-divider);
}
.pleft{display:flex;align-items:center;gap:12px;min-width:0}
.psq{width:10px;height:10px;flex:none;border:2px solid var(--color-accent)}
.psq.filled{background:var(--color-text);border-color:var(--color-text)}
.pname{font-weight:800;font-size:19px;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pmeta{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--color-neutral-700);text-align:right;flex:none}
.prow.dim{color:var(--color-neutral-700)}
.footnote{padding:22px 20px 0;font-size:12px;line-height:1.6;color:var(--color-neutral-700);max-width:44ch;text-wrap:pretty}
.remrow{display:flex;align-items:stretch;gap:0;padding:14px 20px 0}
.remtime{
  flex:1;min-width:0;background:var(--color-surface);border:1px solid var(--color-divider);
  border-right:0;padding:11px 12px;font-weight:800;font-size:17px;color:var(--color-text);
}
.remtime:focus{outline:none;border-color:var(--color-accent)}
.installcard{
  display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;
  margin:24px 20px 0;padding:14px 16px;border:2px solid var(--color-neutral-300);
}
.remnote{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;padding:10px 20px 0}
.dismiss{
  background:transparent;border:0;padding:0;cursor:pointer;font-weight:800;font-size:11px;
  letter-spacing:.12em;text-transform:uppercase;color:var(--color-neutral-600);white-space:nowrap;
}

/* board */
.pagehead{padding:22px 20px 14px}
.pagetitle{font-weight:800;font-size:34px;line-height:1;letter-spacing:-.03em}
.pagesub{font-size:12px;color:var(--color-neutral-700);margin-top:6px}
.standrow{padding:14px 20px;border-bottom:1px solid var(--color-divider);cursor:pointer}
.standtop{display:flex;align-items:baseline;gap:12px;min-width:0}
.srank{font-weight:800;font-size:13px;width:22px;flex:none}
.sname{font-weight:800;font-size:22px;letter-spacing:-.02em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scrown{font-size:9px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;opacity:.8}
.stotal{font-weight:800;font-size:22px;letter-spacing:-.02em}
.sof{font-size:11px;font-weight:600}
.cells{display:flex;gap:5px;margin-top:10px;padding-left:34px}
.cell{flex:1;height:26px}
.dayheads{display:flex;gap:5px;padding:18px 20px 14px}
.dayheads div{flex:1;text-align:center;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--color-neutral-600)}
.outlinebtn{
  width:calc(100% - 40px);margin:0 20px 18px;background:transparent;
  border:2px solid var(--color-text);padding:14px 16px;cursor:pointer;
  font-weight:800;font-size:14px;letter-spacing:.04em;text-transform:uppercase;
  text-align:left;color:var(--color-text);
}

/* sparkline */
.sparkwrap{padding:0 20px}
.sparklbl{font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--color-neutral-700);padding-bottom:12px}
.spark{display:flex;align-items:flex-end;gap:6px;border-bottom:2px solid var(--color-divider);padding-bottom:10px}
.sparkcol{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.sparktrack{height:70px;flex:none;display:flex;flex-direction:column;justify-content:flex-end}
.sparkbar{width:100%;flex:none;background:var(--color-neutral-300)}
.sparkbar.now{background:var(--color-accent)}
.sparkn{font-size:9px;font-weight:600;text-align:center;color:var(--color-neutral-600)}

/* sync + version */
.syncline{
  display:flex;align-items:center;gap:8px;padding:14px 20px;
  font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--color-neutral-600);
}
.syncdot{width:8px;height:8px;flex:none;background:var(--color-neutral-400)}
.syncline.live .syncdot{background:var(--color-accent)}
.syncline.wait .syncdot{background:var(--color-neutral-600);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.verbtn{
  display:flex;width:calc(100% - 40px);margin:0 20px 16px;align-items:center;justify-content:space-between;
  gap:12px;background:transparent;border:0;border-top:1px solid var(--color-divider);
  border-bottom:1px solid var(--color-divider);padding:13px 0;cursor:pointer;
  font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
  color:var(--color-neutral-600);text-align:left;
}

/* feed */
.frow{display:flex;gap:14px;padding:16px 20px;border-bottom:1px solid var(--color-divider)}
.fdot{width:8px;flex:none;margin-top:7px;height:8px}
.fline{font-weight:800;font-size:17px;letter-spacing:-.01em}
.ft{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--color-neutral-600);margin-top:3px}

/* tabs */
.tabs{
  flex:none;border-top:2px solid var(--color-text);display:flex;
  background:var(--color-bg);padding-bottom:env(safe-area-inset-bottom);
}
.tab{
  flex:1;background:transparent;color:var(--color-neutral-700);border:0;
  padding:16px 14px;text-align:left;cursor:pointer;
  font-weight:800;font-size:12px;letter-spacing:.1em;text-transform:uppercase;
}
.tab+.tab{border-left:1px solid var(--color-divider)}
.tab.on{background:var(--color-text);color:var(--color-bg)}

/* full-screen overlays */
.sheet{
  position:absolute;inset:0;z-index:70;background:var(--color-bg);
  display:flex;flex-direction:column;overflow-y:auto;
  padding:48px 0 calc(30px + env(safe-area-inset-bottom));
}
.sheet.accent{background:var(--color-accent);color:var(--color-bg)}
.pad{padding:0 20px}
.hero-title{font-weight:800;font-size:48px;line-height:.88;letter-spacing:-.045em;margin-top:16px}
.body-copy{font-size:14px;line-height:1.55;color:var(--color-neutral-800);max-width:320px}
.label{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--color-neutral-700)}
.bigin{
  width:100%;background:var(--color-surface);border:1px solid var(--color-divider);
  padding:14px;font-weight:800;font-size:22px;letter-spacing:-.01em;color:var(--color-text);
}
.bigin:focus{outline:none;border-color:var(--color-accent)}
.cta{
  display:flex;width:100%;align-items:center;justify-content:space-between;gap:12px;
  background:var(--color-accent);color:var(--color-bg);border:0;padding:22px 20px;
  cursor:pointer;font-weight:800;font-size:22px;letter-spacing:-.01em;text-align:left;
}
.cta:disabled{background:var(--color-neutral-400);cursor:not-allowed}
.cta .arrow{font-size:20px}
.linkbtn{
  background:transparent;border:0;padding:0;cursor:pointer;font-size:12px;font-weight:600;
  letter-spacing:.06em;text-transform:uppercase;color:var(--color-neutral-700);
  text-decoration:underline;text-underline-offset:3px;
}
.spacer{flex:1;min-height:16px}

.addrow{display:flex;padding:16px 20px}
.addrow input{
  flex:1;min-width:0;background:var(--color-surface);border:1px solid var(--color-divider);
  border-right:0;padding:12px;font-weight:800;font-size:17px;color:var(--color-text);
}
.addrow input:focus{outline:none;border-color:var(--color-accent)}
.addbtn{
  background:var(--color-text);color:var(--color-bg);border:0;padding:0 18px;cursor:pointer;
  font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase;
}
.rrow{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:13px 20px;border-top:1px solid var(--color-divider);
}
.xbtn{
  background:transparent;border:1px solid var(--color-divider);width:26px;height:26px;
  flex:none;cursor:pointer;color:var(--color-neutral-700);font-size:13px;line-height:1;
}
.invitebar{padding:16px 20px;border-top:2px solid var(--color-divider)}
.linkcta{
  display:flex;width:100%;align-items:center;justify-content:space-between;gap:12px;
  background:var(--color-text);color:var(--color-bg);border:0;margin-top:14px;
  padding:14px 16px;cursor:pointer;font-weight:800;font-size:13px;
  letter-spacing:.08em;text-transform:uppercase;text-align:left;
}
.linkcta span{font-size:14px}
.codebar{
  padding:14px 20px;border-top:2px solid var(--color-divider);
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.sharebtn{
  background:transparent;border:2px solid var(--color-text);padding:11px 14px;cursor:pointer;
  font-weight:800;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--color-text);
}

/* celebrate */
.cel-num{font-weight:800;font-size:130px;line-height:.78;letter-spacing:-.06em;margin-top:18px}
.cel-sub{font-weight:800;font-size:34px;line-height:1;letter-spacing:-.03em;margin-top:6px}
.cel-rule{height:2px;background:rgba(243,242,242,.5);margin:26px 0 0}
.cel-mid{display:flex;align-items:flex-end;gap:16px;padding:22px 0;min-width:0;overflow:hidden}
.cel-streak{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  width:100px;height:100px;flex:none;padding:6px;overflow:hidden;border:3px solid var(--color-bg);
}
.streaklbl{font-size:8px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;text-align:center;line-height:1.15}
.cel-cta{
  width:100%;background:var(--color-bg);color:var(--color-accent-700);border:0;padding:20px;
  cursor:pointer;font-weight:800;font-size:18px;letter-spacing:.02em;text-align:left;
}

/* verdict */
.vwin{background:var(--color-accent);color:var(--color-bg);padding:22px 20px}
.vname{font-weight:800;font-size:46px;line-height:1;letter-spacing:-.04em;margin-top:8px}
.vlose{padding:22px 20px;border-bottom:2px solid var(--color-divider)}
.playbtn{
  display:inline-block;margin-top:14px;border:2px solid var(--color-bg);color:var(--color-bg);
  padding:9px 14px;font-weight:800;font-size:12px;letter-spacing:.06em;
  text-transform:uppercase;text-decoration:none;
}
.playbtn.dark{border-color:var(--color-neutral-700);color:var(--color-text)}
.vrow{display:flex;align-items:baseline;gap:12px;padding:9px 0;border-bottom:1px solid var(--color-divider)}
.darkcta{
  width:100%;background:var(--color-text);color:var(--color-bg);border:0;padding:18px 20px;
  cursor:pointer;font-weight:800;font-size:16px;text-align:left;
}

/* profile bottom sheet */
.scrim{
  position:absolute;inset:0;z-index:85;background:rgba(32,30,29,.55);
  display:flex;flex-direction:column;justify-content:flex-end;
}
.psheet{
  background:var(--color-bg);border-top:2px solid var(--color-text);
  padding:22px 20px calc(34px + env(safe-area-inset-bottom));
}
.pstats{display:flex;margin-top:18px;border-top:2px solid var(--color-divider)}
.pstat{flex:1;padding:14px 0}
.pstatnum{font-weight:800;font-size:34px;line-height:1}
.pstatlbl{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--color-neutral-700);margin-top:4px}

/* update toast — sits above the tab bar */
.toast{
  position:absolute;left:0;right:0;bottom:calc(54px + env(safe-area-inset-bottom));z-index:95;
  background:var(--color-text);color:var(--color-bg);display:grid;
  grid-template-columns:minmax(0,1fr) auto auto;gap:14px;align-items:center;
  padding:14px 0 14px 20px;
}
.toast p{margin:0;font-size:13px;font-weight:600;line-height:1.35}
.toast .later{
  background:transparent;border:0;padding:0;cursor:pointer;font-weight:800;font-size:11px;
  letter-spacing:.12em;text-transform:uppercase;color:rgba(243,242,242,.6);white-space:nowrap;
}
.toast .go{
  background:var(--color-accent);color:var(--color-bg);border:0;padding:14px 18px;cursor:pointer;
  font-weight:800;font-size:11px;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;
}

.boot{padding:60px 20px;text-align:center;color:var(--color-neutral-700);font-size:13px}
.err{padding:14px 20px;background:var(--color-accent);color:var(--color-bg);font-size:13px;font-weight:600}
</style>
</head>

  let profileId = null, celebrate = null, podium = false, rolling = false;
  let undoLeft = 0, undoTimer = null, undoSnapshot = null;
  let shared = false, nameDraft = '', friendDraft = '', banner = '';
  let syncState = 'off', syncAt = 0;          // off | live | offline | error

  const today = () => iso(new Date());
  function addDays(s,n){ const d=new Date(s+'T00:00:00'); d.setDate(d.getDate()+n); return iso(d); }
  function mondayOf(s){

    d.setDate(d.getDate()-dow);
    return iso(d);
  }
  const DAYH = ['M','T','W','T','F','S','S'];
  const DAYN = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

  /* ---------- storage ---------- */
  const inClaude = !!(window.storage && typeof window.storage.get === 'function');
  let db = null;
  let authReady = null;
  if(!inClaude && !fbError){
    try{
      const fbApp = initializeApp(firebaseConfig);
      db = getFirestore(fbApp);
      // Queues writes made with no signal and serves a cold offline start from cache.
      enableIndexedDbPersistence(db).catch(()=>{});   // multi-tab or unsupported — fine
      // Anonymous sign-in: a stable per-device identity so the Firestore rule can
      // require auth. Resolves either way — a failure must not block the app.
      const auth = getAuth(fbApp);
      authReady = new Promise(resolve=>{
        let settled = false;
        const done = v => { if(!settled){ settled = true; resolve(v); } };
        onAuthStateChanged(auth, u => { if(u) done(true); });
        signInAnonymously(auth).catch(e=>{ console.warn('anon auth', e.code||e.message); done(false); });
        setTimeout(()=>done(false), 8000);
      });
    }
    catch(e){ console.error('firebase init', e); syncState = 'error'; }
  }
  async function loadShared(){
    if(inClaude){
      try{ const r = await window.storage.get(STATE_KEY, true); return r && r.value ? JSON.parse(r.value) : null; }
      catch(e){ return null; }
    }
    if(db){
      // CRITICAL: distinguish "no board exists" from "couldn't reach the board".
      // Returning null for the second case makes onboarding overwrite a live board.
      try{
        const s = await Promise.race([
          getDoc(doc(db,'pushup',STATE_KEY)),
          new Promise((_,rej)=> setTimeout(()=>rej(new Error('timeout')), 8000))
        ]);
        // A cache-served answer is NOT proof of the board's real contents — Firestore can
        // report "doesn't exist" from its own empty cache while offline.
        const fromCache = !!(s.metadata && s.metadata.fromCache);
        reachedServer = !fromCache;
        syncState = fromCache ? 'offline' : 'live';
        if(!fromCache) syncAt = Date.now();
        if(!s.exists()) return null;
        return JSON.parse(s.data().value);
      }
      catch(e){ syncState = 'offline'; reachedServer = false; return null; }
    }
    try{ const raw = localStorage.getItem(STATE_KEY); return raw ? JSON.parse(raw) : null; }catch(e){ return null; }
  }
  async function saveShared(){
    // Never let a phone that could not read the board write over it.
    if(db && !reachedServer){ console.warn('save blocked — board not yet loaded'); return; }
    const v = JSON.stringify(state);
    // Mirror locally always, so a cold offline launch still has the board.
    try{ localStorage.setItem(STATE_KEY, v); }catch(e){}
    if(inClaude){ try{ await window.storage.set(STATE_KEY, v, true); }catch(e){} return; }
    if(db){
      try{ await setDoc(doc(db,'pushup',STATE_KEY),{value:v,updatedAt:Date.now()});
           syncState = 'live'; syncAt = Date.now(); }
      catch(e){ syncState = 'offline'; }
      return;
    }
  }
  function watch(){
    if(inClaude || !db) return;
    onSnapshot(doc(db,'pushup',STATE_KEY), snap=>{
      syncState = (snap.metadata && snap.metadata.fromCache && !navigator.onLine) ? 'offline' : 'live';
      syncAt = Date.now();
      if(!(snap.metadata && snap.metadata.fromCache)) reachedServer = true;
      if(!snap.exists()){ paintSync(); return; }
      const v = snap.data().value;
      if(v && v !== JSON.stringify(state)){
        try{
          const incoming = JSON.parse(v);
          if(state && boardScore(incoming) < boardScore(state)){
            // Someone's phone pushed an emptier board. Keep ours and put it back.
            saveShared(); paintSync(); return;
          }
        }catch(e){}
        state = JSON.parse(v);
        try{ localStorage.setItem(STATE_KEY, v); }catch(e){}
        rollIfNeeded(false); render();
      } else paintSync();
    }, e=>{ console.error(e); syncState = 'error'; paintSync(); });

    window.addEventListener('online',  ()=>{ syncState = 'live';    paintSync(); });
    window.addEventListener('offline', ()=>{ syncState = 'offline'; paintSync(); });
  }
  function loadMe(){ try{ return localStorage.getItem(ME_KEY) || null; }catch(e){ return null; } }
  function saveMe(id){ myId = id; try{ localStorage.setItem(ME_KEY, id||''); }catch(e){} }

  /* ---------- model ---------- */
  function blank(){
    return { week:1, weekStart: mondayOf(today()), players:[], feed:[], history:[] };
  }
  const uid = () => 'p'+Math.random().toString(36).slice(2,9);
  const weekDates = () => Array.from({length:7},(_,i)=>addDays(state.weekStart,i));
  function dayIdx(){
    const ds = weekDates(), t = today();
    const i = ds.indexOf(t);
    return i >= 0 ? i : (t > ds[6] ? 6 : 0);
  }
  const totalOf = p => weekDates().reduce((n,d)=> n + (p.log && p.log[d] ? 1 : 0), 0);
  function streakOf(p){
    if(!p.log) return 0;
    let n = 0, d = today();
    if(!p.log[d]) d = addDays(d,-1);          // today not logged yet doesn't break it
    while(p.log[d]){ n++; d = addDays(d,-1); }
    return n;
  }
  const me = () => state.players.find(p=>p.id===myId) || null;
  function ranked(){
    return [...state.players].sort((a,b)=> totalOf(b)-totalOf(a) || streakOf(b)-streakOf(a));
  }
  const esc = s => { const d=document.createElement('div'); d.textContent = s==null?'':s; return d.innerHTML; };
  const andList = a => a.length<2 ? (a[0]||'') : a.slice(0,-1).join(', ')+' and '+a[a.length-1];
  const ord = n => n + (n===1?'st':n===2?'nd':n===3?'rd':'th');
  const dayWord = n => n===1 ? 'a day' : n+' days';
  function nowLabel(){ return new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}); }
  function pushFeed(txt, who){
    state.feed.unshift({who: who||'', txt, at: Date.now()});
    state.feed = state.feed.slice(0,40);
  }
  function feedTime(at){
    const mins = Math.round((Date.now()-at)/60000);
    if(mins < 1) return 'Just now';
    if(mins < 60) return mins+'m ago';
    const d = new Date(at), t = d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
    return iso(d)===today() ? t : (iso(d)===addDays(today(),-1) ? 'Yesterday '+t : DAYN[(d.getDay()+6)%7]+' '+t);
  }

  /* ---------- weekly roll ---------- */
  function rollIfNeeded(save){
    if(!state || !state.players.length) return false;
    const wantStart = mondayOf(today());
    if(wantStart === state.weekStart) return false;
    const r = ranked();
    if(r.length){
      const top = totalOf(r[0]), bot = totalOf(r[r.length-1]);
      state.history.unshift({
        week: state.week,
        start: state.weekStart,
        winners: r.filter(p=>totalOf(p)===top).map(p=>({name:p.name,total:top})),
        losers: top===bot ? [] : r.filter(p=>totalOf(p)===bot).map(p=>({name:p.name,total:bot})),
        table: r.map(p=>({id:p.id,name:p.name,total:totalOf(p)}))
      });
      state.history = state.history.slice(0,12);
      state.players.forEach(p=>{
        p.weeksPlayed = (p.weeksPlayed||0)+1;
        if(totalOf(p)===top && top>0) p.weeksWon = (p.weeksWon||0)+1;
      });
    }
    state.week += 1;
    state.weekStart = wantStart;
    pushFeed('week '+state.week+' is live','The board');
    rolling = true;
    if(save!==false) saveShared();
    return true;
  }

  /* ---------- actions ---------- */
  // Logs are locked to the real current day. `lastSeen` only ever moves forward, so
  // winding the phone clock back to fill in a missed day is refused.
  function lockedBack(){
    return !!(state.lastSeen && today() < state.lastSeen);
  }
  function touchSeen(){
    if(!state.lastSeen || today() > state.lastSeen){ state.lastSeen = today(); return true; }
    return false;
  }

  function logToday(){
    const p = me(); if(!p) return;
    if(p.log && p.log[today()]) return;
    if(lockedBack()){
      banner = 'That day is closed. You can only log today.';
      render(); setTimeout(()=>{ banner=''; render(); }, 3200);
      return;
    }
    if(navigator.vibrate) navigator.vibrate([90,50,140]);
    undoSnapshot = JSON.parse(JSON.stringify(state));
    const from = ranked().findIndex(x=>x.id===myId)+1;
    p.log = p.log || {}; p.log[today()] = 1;
    p.loggedAt = nowLabel();
    const to = ranked().findIndex(x=>x.id===myId)+1;
    pushFeed('hit 100', p.name);
    celebrate = {from: ord(from), to: ord(to), at: p.loggedAt};
    startUndo();
    saveShared(); render();
  }
  function startUndo(){
    clearInterval(undoTimer); undoLeft = UNDO_SECS;
    undoTimer = setInterval(()=>{
      undoLeft--;
      if(undoLeft<=0){ clearInterval(undoTimer); undoLeft=0; undoSnapshot=null; render(); return; }
      const el = document.getElementById('undo-lbl');
      if(el) el.textContent = 'Undo ('+undoLeft+'s)'; else render();
    },1000);
  }
  function undoLog(){
    if(!undoSnapshot) return;
    clearInterval(undoTimer); undoLeft = 0;
    state = undoSnapshot; undoSnapshot = null;
    celebrate = null; tab = 'today';
    saveShared(); render();
  }
  function addFriend(name){
    name = (name||'').trim(); if(!name) return null;
    const p = {id:uid(), name, log:{}, weeksWon:0, weeksPlayed:0};
    state.players.push(p);
    return p.id;
  }
  /* ---------- daily reminder (calendar) ---------- */
  const RT_KEY = 'pushup-v2-remind' + (BOARD ? ':' + BOARD : '');
  function remindAt(){ try{ return localStorage.getItem(RT_KEY) || '20:00'; }catch(e){ return '20:00'; } }
  function setRemindAt(v){ try{ localStorage.setItem(RT_KEY, v); }catch(e){} }
  const IN_KEY = 'pushup-v2-install:off';
  function installOff(){ try{ return localStorage.getItem(IN_KEY)==='1'; }catch(e){ return false; } }
  function setInstallOff(){ try{ localStorage.setItem(IN_KEY,'1'); }catch(e){} }
  function installHow(){
    const ua = navigator.userAgent;
    const iOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
    // On iOS every browser is WebKit underneath; only Safari proper can install.
    const iosOtherBrowser = iOS && /CriOS|FxiOS|EdgiOS|OPiOS/.test(ua);
    if(iosOtherBrowser) return {
      title:'Open this in Safari first.',
      body:'Chrome on iPhone can\u2019t add apps to the home screen \u2014 only Safari can. Copy the link, open it in Safari, then Share \u2192 Add to Home Screen.'
    };
    if(iOS) return {
      title:'Put it on your home screen.',
      body:'Tap Share \u2193 then Add to Home Screen. One tap from the lock screen, and it works with no signal.'
    };
    if(/Android/.test(ua)) return {
      title:'Install it as an app.',
      body:'Tap the \u22ee menu, then <em>Add to Home screen</em> or <em>Install</em> \u2014 whichever it says. If it asks, pick <strong style="font-weight:800">Install</strong>, not shortcut: only Install works offline and updates itself.'
    };
    return {
      title:'Install it as an app.',
      body:'Use the install icon in the address bar, or your browser\u2019s menu \u2192 Install. It then opens in its own window and works offline.'
    };
  }
  // Already installed? Then the card has nothing to say.
  function isStandalone(){
    return !!(window.navigator.standalone || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches));
  }
  const RD_KEY = RT_KEY + ':off';
  function remindOff(){ try{ return localStorage.getItem(RD_KEY)==='1'; }catch(e){ return false; } }
  function setRemindOff(){ try{ localStorage.setItem(RD_KEY,'1'); }catch(e){} }
  const RA_KEY = RT_KEY + ':added';
  function remindAdded(){ try{ return localStorage.getItem(RA_KEY)==='1'; }catch(e){ return false; } }
  function setRemindAdded(){ try{ localStorage.setItem(RA_KEY,'1'); }catch(e){} }
  function prettyTime(hhmm){
    const [h,m] = hhmm.split(':').map(Number);
    const ap = h < 12 ? 'AM' : 'PM';
    const h12 = h % 12 === 0 ? 12 : h % 12;
    return h12 + ':' + String(m).padStart(2,'0') + ' ' + ap;
  }
  // A daily repeating event with a 0-minute alarm. iOS opens the add-to-calendar
  // sheet straight from the download, so this needs no notification permission.
  function addToCalendar(){
    const t = remindAt();
    const [h,m] = t.split(':').map(Number);
    const d = new Date();
    d.setHours(h, m, 0, 0);
    if(d.getTime() < Date.now()) d.setDate(d.getDate()+1);   // start tomorrow if today's slot passed
    const p2 = n => String(n).padStart(2,'0');
    const local = dt => dt.getFullYear()+p2(dt.getMonth()+1)+p2(dt.getDate())+'T'+p2(dt.getHours())+p2(dt.getMinutes())+'00';
    const end = new Date(d.getTime() + 20*60000);
    const stamp = new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
    const ics = [
      'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//100 Push-Ups//EN','CALSCALE:GREGORIAN',
      'BEGIN:VEVENT',
      'UID:pushups-daily-'+(BOARD||'main')+'@100pushups',
      'DTSTAMP:'+stamp,
      'DTSTART:'+local(d),
      'DTEND:'+local(end),
      'RRULE:FREQ=DAILY',
      'SUMMARY:100 push-ups',
      'DESCRIPTION:100 or nothing. Log it when you\u2019re done.',
      'BEGIN:VALARM','TRIGGER:-PT0M','ACTION:DISPLAY','DESCRIPTION:100 push-ups','END:VALARM',
      'END:VEVENT','END:VCALENDAR'
    ].join('\r\n');
    const blob = new Blob([ics], {type:'text/calendar;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = '100-pushups-daily.ics';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    setRemindAdded(); render();
  }

  function shareCode(){
    const base = location.href.split('#')[0];
    const url = BOARD ? base + '#' + BOARD : base;
    const txt = "100 push-ups a day, 7 days. Open this, type your name, you're in.";
    if(navigator.share){
      navigator.share({title:'100 Push-Ups', text:txt, url}).catch(()=>{});
      shared = 'sent';
    } else {
      if(navigator.clipboard){ navigator.clipboard.writeText(txt+' '+url).catch(()=>{}); }
      else {
        const ta = document.createElement('textarea');
        ta.value = txt+' '+url; ta.style.position='fixed'; ta.style.opacity='0';
        document.body.appendChild(ta); ta.select();
        try{ document.execCommand('copy'); }catch(e){}
        ta.remove();
      }
      shared = 'copied';
    }
    render();
    setTimeout(()=>{ shared=false; render(); },1800);
  }

  const shareLabel = () => shared==='sent' ? 'Sent \u2713' : shared==='copied' ? 'Link copied \u2713' : 'Send the link';

  /* ---------- sync line ---------- */
  const SYNC_TEXT = {
    off:     'Local only — this device',
    live:    'Shared board · live',
    offline: 'Offline — your logs will sync when you\u2019re back',
    error:   'Sync unavailable — saved on this phone'
  };
  function syncHTML(){
    const cls = syncState==='live' ? 'live' : (syncState==='offline' ? 'wait' : '');
    const when = (syncState==='live' && syncAt)
      ? ' · ' + new Date(syncAt).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}) : '';
    return '<div class="syncline '+cls+'" id="syncline"><div class="syncdot"></div>'
         + '<div>'+SYNC_TEXT[syncState]+when+'</div></div>';
  }
  function paintSync(){
    const el = document.getElementById('syncline');

    el.replaceWith(tmp.firstChild);
  }

  /* ---------- render ---------- */
  function cellsFor(p, invert){
    return weekDates().map((d,i)=>{
      const on = p.log && p.log[d];
      const past = i <= dayIdx();
      const fill = on ? (invert?'var(--color-bg)':'var(--color-accent)')
                      : (past ? (invert?'rgba(32,30,29,.34)':'var(--color-neutral-300)') : 'transparent');
      const border = on ? '0' : (invert?'1px solid rgba(243,242,242,.55)':'1px solid var(--color-divider)');
      return '<div class="cell" style="background:'+fill+';border:'+border+'"></div>';
    }).join('');
  }

  function viewWelcome(){
    return '<div class="sheet">'
      + '<div class="pad">'
      +   '<div class="label">A weekly challenge with friends</div>'
      +   '<div class="hero-title">ONE<br>HUNDRED.<br>EVERY DAY.</div>'
      + '</div>'
      + '<div class="rule2" style="margin-top:26px"></div>'
      + '<div class="pad" style="padding-top:20px;padding-bottom:20px"><div class="body-copy">100 push-ups, seven days. One tap to log it. Everyone sees who\'s still short.</div></div>'
      + '<div class="rule1"></div>'
      + '<div class="pad" style="padding-top:22px;padding-bottom:22px">'
      +   '<div class="label" style="margin-bottom:8px">What do they call you?</div>'
      +   '<input class="bigin" id="w-name" placeholder="First name" maxlength="16" value="'+esc(nameDraft)+'">'
      + '</div>'
      + '<div class="spacer"></div>'
      + '<button class="cta" id="w-next" '+(nameDraft.trim()?'':'disabled')+'>THAT\'S ME<span class="arrow">→</span></button>'

      + '</div>';
  }

  function viewInvite(){
    const rows = state.players.map(p=>
      '<div class="rrow">'
      + '<div class="pleft"><div class="psq '+(p.id===myId?'':'filled')+'"></div>'
      +   '<div class="pname">'+esc(p.name)+'</div>'
      +   '<div class="label" style="letter-spacing:.1em">'+(p.id===myId?'you':'in')+'</div></div>'

      +   '<div style="font-size:13px;line-height:1.5;color:var(--color-neutral-800);margin-top:12px">Send the link. They open it, type their own name, and they\'re on the board — logs appear on everyone\'s phone as they happen, and queue up if someone\'s offline.</div></div>'
      + '<div class="rule2" style="margin-top:22px"></div>'

      + '<div style="padding:14px 20px 0;font-size:12.5px;line-height:1.5;color:var(--color-neutral-700);max-width:38ch">Everyone else appears here as they join.</div>'
      + '<div class="spacer"></div>'

      +   '<button class="linkcta" id="i-share">'+shareLabel()+'<span>\u2197</span></button></div>'
      + '<button class="cta" id="i-start">START THE WEEK<span class="arrow">→</span></button>'
      + '</div>';
  }

  function viewToday(){
    const p = me(), di = dayIdx(), d = weekDates()[di];
    const done = !!(p.log && p.log[d]);
    const late = new Date().getHours() >= 21;
    const pendOthers = state.players.filter(x=>x.id!==myId && !(x.log&&x.log[d]));
    const finished = state.players.filter(x=>x.log&&x.log[d]);
    const r = ranked(), lead = r[0], myTotal = totalOf(p), st = streakOf(p);

    let gap;
    if(lead && lead.id===myId){
      const rest = r.filter(x=>x.id!==myId);
      const g = rest.length ? myTotal-totalOf(rest[0]) : 0;
      gap = g>0 ? 'You lead by '+dayWord(g)+'. Keep it.'
                : (rest.length ? 'Tied at the top with '+andList(rest.filter(x=>totalOf(x)===myTotal).map(x=>x.name))+'.' : 'Just you so far.');
    } else if(lead){

      gap = g===0 ? 'Level with '+lead.name+' — streak breaks the tie.'
                  : (g===1?'One day':dayWord(g))+' behind '+lead.name+'.';
    } else gap = '';

    let h = '';
    // The red 100 IS the button.
    h += '<button class="herobtn '+(done?'done':(late?'late':''))+'" id="t-hero"'+(done?' disabled':'')+'>'
      +  '<div class="kicker">'+(done?'Today · banked':(late?'Today · one hour left':'Today · not logged yet'))+'</div>'
      +  '<div class="big100">100</div>'
      +  '<div class="herofoot"><div class="subhead">'+(done?'IN THE BANK.':'PUSH-UPS')+'</div>'
      +  '<div class="heroact">'+(done?'Done ✓':'Tap when done →')+'</div></div></button>';

    h += '<div class="statrow">'
      +  '<div class="stat"><div class="statlbl">Your week</div><div class="statval">'+myTotal+'<small>/7</small></div></div>'
      +  '<div class="stat"><div class="statlbl">Streak</div><div class="statval" style="color:var(--color-accent-700)">'+st+'<small> d</small></div></div>'
      +  '<div class="stat"><div class="statlbl">Rank</div><div class="statval">'+ord(r.findIndex(x=>x.id===myId)+1)+'<small>/'+state.players.length+'</small></div></div>'
      +  '</div>';

    if(done){
      h += '<div class="donemeta">'+(undoLeft>0?'Logged just now · sent to the group':'Logged'+(p.loggedAt?' '+esc(p.loggedAt):'')+' · locked in')+'</div>';
    } else if(late){
      h += '<div class="latebar"><div class="latedot"></div><div class="lateline">'
        + (pendOthers.length ? esc(andList(pendOthers.map(x=>x.name)))+(pendOthers.length>1?' are short too.':' is short too.') : 'You\'re the only one short.')
        + '</div></div>';
    }

    if(gap) h += '<div class="gapline">'+esc(gap)+'</div>';

    h += '<div class="sechead"><div class="t">Still not done today</div><div class="fill"></div><div class="n">'+pendOthers.length+'</div></div>';
    h += pendOthers.map(x=>{
      const s2 = streakOf(x);
      const meta = s2>0 ? s2+'-day streak on the line' : (di===0?'day one — nothing logged':'no streak left to protect');
      return '<div class="prow"><div class="pleft"><div class="psq"></div><div class="pname">'+esc(x.name)+'</div></div>'
           + '<div class="pmeta">'+meta+'</div></div>';
    }).join('') || '<div class="prow"><div class="pmeta" style="text-align:left">Everyone\'s in. '+(done?'Nobody slipped.':'You\'re the last name on the board.')+'</div></div>';

    if(finished.length){
      h += '<div class="sechead"><div class="t">In the bank</div><div class="fill"></div></div>';
      h += finished.map(x=>'<div class="prow dim"><div class="pleft"><div class="psq filled"></div>'
          + '<div class="pname" style="color:var(--color-text)">'+esc(x.id===myId?'You':x.name)+'</div></div>'
          + '<div class="pmeta">at 100</div></div>').join('');

    if(!installOff() && !isStandalone()){
      const how = installHow();
      h += '<div class="installcard">'
        +  '<div style="font-size:12.5px;line-height:1.45;color:var(--color-neutral-800)">'
        +    '<strong style="font-weight:800">'+how.title+'</strong> '+how.body+'</div>'
        +  '<button class="dismiss" id="t-instoff">Got it</button>'
        +  '</div>';
    }
    if(!remindOff()){
      const added = remindAdded();
      h += '<div class="sechead"><div class="t">Daily reminder</div><div class="fill"></div></div>'
        +  '<div class="remrow">'
        +    '<input type="time" id="t-remtime" class="remtime" value="'+remindAt()+'">'
        +    '<button class="sharebtn" id="t-cal" style="flex:none">'+(added?'Added \u2713':'Add to calendar \u2197')+'</button>'
        +  '</div>'
        +  '<div class="remnote">'
        +    '<div style="font-size:12px;line-height:1.6;color:var(--color-neutral-700);max-width:44ch;text-wrap:pretty">'
        +      (added
                 ? 'In your calendar. It fires at '+prettyTime(remindAt())+' whether the app is open or not.'
                 : 'A repeating '+prettyTime(remindAt())+' alarm in your own calendar \u2014 no notification permissions, works on every phone.')
        +    '</div>'
        +    '<button class="dismiss" id="t-remoff">'+(added?'Done':'No thanks')+'</button>'
        +  '</div>';
    }
    h += '<div style="height:40px"></div>';
    return h;
  }

  function viewBoard(){
    const r = ranked();
    let h = '<div class="pagehead"><div class="pagetitle">THE BOARD</div>'
          + '<div class="pagesub">Days at 100, this week. Ties broken by streak.</div></div><div class="rule2"></div>';
    h += r.map((p,i)=>{
      const top = i===0 && totalOf(p)>0;
      const bg = top?'var(--color-accent)':(p.id===myId?'var(--color-neutral-200)':'transparent');
      const fg = top?'var(--color-bg)':'var(--color-text)';
      const rf = top?'rgba(243,242,242,.75)':'var(--color-neutral-600)';
      return '<div class="standrow" data-prof="'+p.id+'" style="background:'+bg+';color:'+fg+'">'
        + '<div class="standtop"><div class="srank" style="color:'+rf+'">'+(i+1)+'</div>'
        + '<div class="sname">'+esc(p.id===myId?'YOU':p.name.toUpperCase())+'</div>'
        + (top?'<div class="scrown">Leading</div>':'')
        + '<div class="stotal">'+totalOf(p)+'</div><div class="sof" style="color:'+rf+'">/7</div></div>'
        + '<div class="cells">'+cellsFor(p, top)+'</div></div>';
    }).join('');
    h += '<div class="dayheads">'+DAYH.map(l=>'<div>'+l+'</div>').join('')+'</div>';

    // Sparkline — my last 8 weeks, from real history.
    const mine = state.history.slice(0,7).map(w=>{
      const row = (w.table||[]).find(x=>x.id===myId) || (w.table||[]).find(x=>me() && x.name===me().name);
      return row ? row.total : 0;
    }).reverse();
    const bars = mine.concat([totalOf(me())]);
    if(bars.length > 1){
      h += '<div class="sparkwrap"><div class="sparklbl">Your last '+bars.length+' weeks · days at 100</div><div class="spark">'
        + bars.map((n,i)=>'<div class="sparkcol"><div class="sparktrack">'
            + '<div class="sparkbar'+(i===bars.length-1?' now':'')+'" style="height:'+Math.max(4,Math.round(n/7*70))+'px"></div>'
            + '</div><div class="sparkn">'+n+'</div></div>').join('')
        + '</div></div>';
    }

    h += syncHTML();
    h += '<button class="verbtn" id="b-ver"><span>Version '+APP_VERSION+'</span><span>'+(checking?'Checking…':'Check for update →')+'</span></button>';
    h += '<button class="outlinebtn" id="b-verdict">See the verdict →</button>';
    if(state.history.length){
      h += '<div class="sechead"><div class="t">Past weeks</div><div class="fill"></div></div>';
      h += state.history.map(w=>'<div class="prow"><div class="pleft"><div class="pname" style="font-size:16px">'
        + esc(w.winners.map(x=>x.name).join(', '))+'</div></div>'
        + '<div class="pmeta">Wk '+w.week+' · carried the boats</div></div>').join('');
    }
    h += '<div style="height:20px"></div>';
    return h;
  }

      + '<div class="label">Week '+state.week+' · standing</div>'

      + '<div class="vname">'+esc(andList(wins.map(p=>p.id===myId?'YOU':p.name.toUpperCase())))+'</div>'
      + '<div style="font-size:12px;margin-top:6px;opacity:.9">'+top+' of 7. Untouchable.</div>'
      + '<a class="playbtn" href="'+REF_WIN+'" target="_blank" rel="noopener">Play the speech ↗</a></div>';
    if(sweep){
      h += '<div class="vlose"><div class="label" style="font-size:10px">No yogourt this week</div>'

        + '<div style="font-size:12px;margin-top:8px;color:var(--color-neutral-700)">Nobody finished last. Raise the target or find harder friends.</div></div>';

  function render(){
    const app = document.getElementById('app');
    if(!state){ app.innerHTML = '<div class="boot">Loading…</div>'; return; }

    if(!myId || !me()){ app.innerHTML = viewWelcome(); bindWelcome(); return; }
    if(!state.started){ app.innerHTML = viewInvite(); bindInvite(); return; }
    if(rolling){ app.innerHTML = viewRolling(); document.getElementById('r-begin').onclick = ()=>{ rolling=false; tab='today'; render(); }; return; }
    if(celebrate){
      app.innerHTML = viewCelebrate();
      document.getElementById('c-close').onclick = ()=>{ celebrate=null; tab='board'; render(); };
      return;
    }
    if(podium){ app.innerHTML = viewPodium(); document.getElementById('v-close').onclick = ()=>{ podium=false; render(); }; return; }

    const di = dayIdx();
    const p = me(), d = weekDates()[di];
    const done = !!(p.log && p.log[d]);
    const late = new Date().getHours() >= 21;
    const body = tab==='today' ? viewToday() : tab==='board' ? viewBoard() : viewFeed();

    // Sticky slab on Board/Group only — on Today the red 100 is already the button.
    const slab = (!done && tab!=='today')
      ? '<div class="slabwrap"><div class="slabhint">'+(late?'One hour left · everything or nothing':'Tap once when all 100 are done')+'</div>'
        + '<button class="slab '+(late?'late':'')+'" id="s-log">'+(late?'STILL 100 TO GO':'I DID 100')+'<span class="arrow">→</span></button></div>'
      : '';
    const undo = undoLeft>0
      ? '<div class="undobar"><div class="undotxt">Logged. Mis-tap?</div>'
        + '<button class="undobtn" id="t-undo"><span id="undo-lbl">Undo ('+undoLeft+'s)</span> ↶</button></div>'
      : '';

    app.innerHTML =
        '<div class="top"><div class="top-row">'
      +   '<div class="wk">Wk '+state.week+' · '+state.players.length+' in</div>'
      +   '<div class="daylbl">'+DAYN[di]+' · day '+(di+1)+' of 7</div></div>'
      + '<div class="rule2"></div></div>'
      + (banner?'<div class="err">'+esc(banner)+'</div>':'')
      + '<div class="scroll" id="scroll">'+body+'</div>'
      + slab + undo
      + '<div class="tabs">'
      +   '<button class="tab '+(tab==='today'?'on':'')+'" data-tab="today">Today</button>'
      +   '<button class="tab '+(tab==='board'?'on':'')+'" data-tab="board">Board</button>'
      +   '<button class="tab '+(tab==='feed'?'on':'')+'" data-tab="feed">Group</button>'
      + '</div>'
      + (profileId ? viewProfile() : '')
      + viewToast();
    bindMain();
  }

  /* ---------- bindings ---------- */
  function bindWelcome(){
    const inp = document.getElementById('w-name');
    inp.oninput = e => { nameDraft = e.target.value; document.getElementById('w-next').disabled = !nameDraft.trim(); };
    inp.onkeydown = e => { if(e.key==='Enter') document.getElementById('w-next').click(); };
    document.getElementById('w-next').onclick = async ()=>{
      const n = nameDraft.trim(); if(!n) return;
      const existing = state.players.find(p=>p.name.toLowerCase()===n.toLowerCase());
      const id = existing ? existing.id : addFriend(n);
      saveMe(id); nameDraft='';
      if(!existing) await saveShared();
      render();
    };
    const skip = document.getElementById('w-skip');
    if(skip) skip.onclick = ()=>{
      const names = state.players.map(p=>'<button class="cta" style="margin-bottom:8px" data-pick="'+p.id+'">'+esc(p.name)+'<span class="arrow">→</span></button>').join('');
      document.getElementById('app').innerHTML =
        '<div class="sheet"><div class="pad"><div class="label">Who are you?</div>'
        + '<div class="hero-title" style="font-size:44px">PICK<br>YOUR NAME.</div></div>'
        + '<div style="height:24px"></div><div class="pad">'+names+'</div>'
        + '<div class="spacer"></div><div class="pad"><button class="linkbtn" id="back">← Back</button></div></div>';
      document.querySelectorAll('[data-pick]').forEach(b=> b.onclick = ()=>{ saveMe(b.getAttribute('data-pick')); render(); });
      document.getElementById('back').onclick = render;
    };
  }

  function bindInvite(){
    document.querySelectorAll('[data-rm]').forEach(b=> b.onclick = async ()=>{
      state.players = state.players.filter(p=>p.id!==b.getAttribute('data-rm'));
      await saveShared(); render();
    });
    document.getElementById('i-share').onclick = shareCode;
    document.getElementById('i-start').onclick = async ()=>{
      state.started = true;
      if(!state.weekStart) state.weekStart = mondayOf(today());

  function bindMain(){
    document.querySelectorAll('[data-tab]').forEach(b=> b.onclick = ()=>{ tab = b.getAttribute('data-tab'); render(); });
    const hb = document.getElementById('t-hero'); if(hb) hb.onclick = logToday;
    const sl = document.getElementById('s-log');  if(sl) sl.onclick = logToday;
    const ud = document.getElementById('t-undo'); if(ud) ud.onclick = undoLog;
    const rt = document.getElementById('t-remtime');
    if(rt) rt.onchange = e => { setRemindAt(e.target.value || '20:00'); render(); };
    const cal = document.getElementById('t-cal'); if(cal) cal.onclick = addToCalendar;
    const roff = document.getElementById('t-remoff'); if(roff) roff.onclick = ()=>{ setRemindOff(); render(); };
    const ioff = document.getElementById('t-instoff'); if(ioff) ioff.onclick = ()=>{ setInstallOff(); render(); };
    const bv = document.getElementById('b-verdict'); if(bv) bv.onclick = ()=>{ podium=true; render(); };
    const bver = document.getElementById('b-ver');
    if(bver) bver.onclick = ()=>{
      checking = true; render();
      if(window.checkForUpdate) window.checkForUpdate();
      setTimeout(()=>{ checking = false; render(); }, 2500);
    };
    document.querySelectorAll('[data-prof]').forEach(el=> el.onclick = ()=>{ profileId = el.getAttribute('data-prof'); render(); });
    const px = document.getElementById('prof-x');  if(px) px.onclick = ()=>{ profileId=null; render(); };
    const sc = document.getElementById('prof-scrim');
    if(sc) sc.onclick = e => { if(e.target===sc){ profileId=null; render(); } };

    const ul = document.getElementById('up-later'); if(ul) ul.onclick = ()=>{ updateWorker=null; render(); };
    const ug = document.getElementById('up-go');
    if(ug) ug.onclick = ()=>{ if(updateWorker) updateWorker.postMessage({type:'SKIP_WAITING'}); };

    const gs = document.getElementById('g-share'); if(gs) gs.onclick = shareCode;
    document.querySelectorAll('[data-rm]').forEach(b=> b.onclick = async ()=>{
      const id = b.getAttribute('data-rm');
      state.players = state.players.filter(p=>p.id!==id);
      await saveShared(); render();
    });
  }

  /* ---------- service worker + update prompt ---------- */
  if('serviceWorker' in navigator){
    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('sw.js').then(reg=>{
        if(reg.waiting && navigator.serviceWorker.controller){ updateWorker = reg.waiting; render(); }
        reg.addEventListener('updatefound', ()=>{
          const w = reg.installing; if(!w) return;
          w.addEventListener('statechange', ()=>{
            if(w.state==='installed' && navigator.serviceWorker.controller){ updateWorker = w; render(); }
          });
        });
        // Safari never fires updatefound on its own for a backgrounded app — poke it on return.
        document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) reg.update().catch(()=>{}); });
        window.checkForUpdate = ()=> reg.update().catch(()=>{});
      }).catch(()=>{});

      let reloaded = false;
      navigator.serviceWorker.addEventListener('controllerchange', ()=>{
        if(reloaded) return; reloaded = true; location.reload();
      });
    });
  }

  /* ---------- boot ---------- */
  // How much real history a board holds. Used to refuse a downgrade: if this phone's
  // mirror is richer than what the server has, the server was clobbered — push ours back.
  function boardScore(st){
    if(!st || !Array.isArray(st.players)) return -1;
    const logs = st.players.reduce((n,p)=> n + (p.log ? Object.keys(p.log).length : 0), 0);
    const hist = Array.isArray(st.history) ? st.history.length : 0;
    return st.players.length * 1000 + logs * 10 + hist;
  }
  function localMirror(){
    try{ const raw = localStorage.getItem(STATE_KEY); return raw ? JSON.parse(raw) : null; }catch(e){ return null; }
  }
  function viewUnreachable(){
    return '<div class="sheet"><div class="pad">'
      + '<div class="label">Can\'t reach the board</div>'
      + '<div class="hero-title" style="font-size:44px">HOLD ON.</div>'
      + '<div class="body-copy" style="margin-top:18px">Your board is on the server and this phone couldn\'t read it. Nothing has been changed. Check your signal and try again \u2014 logging now would overwrite everyone\'s week.</div>'
      + '</div><div class="spacer"></div>'
      + '<button class="cta" id="u-retry">TRY AGAIN<span class="arrow">\u2192</span></button></div>';
  }

  async function boot(){
    if(authReady) await authReady;      // rules may require auth; read after sign-in
    const loaded = await loadShared();
    if(!loaded && db && !reachedServer){
      // Could not read the board. Do NOT fall through to onboarding — that path writes.
      const app = document.getElementById('app');
      app.innerHTML = viewUnreachable();
      document.getElementById('u-retry').onclick = ()=>{
        app.innerHTML = '<div class="boot">Loading\u2026</div>';
        // If boot never paints — an uncaught throw, a hung import — replace "Loading…" with
  // something actionable instead of leaving a dead screen.
  const bootWatch = setTimeout(()=>{
    const el = document.getElementById('app');
    if(el && el.querySelector('.boot')){
      el.innerHTML = '<div class="boot" style="text-align:left;padding:0 20px">'
        + '<div style="font-weight:800;font-size:20px;letter-spacing:-.02em">Couldn\u2019t start.</div>'
        + '<div style="font-size:13.5px;line-height:1.5;color:var(--color-neutral-800);margin-top:10px;max-width:34ch">'
        + 'Something blocked the app from loading \u2014 usually a network filter or a private-browsing window. '
        + 'Try again on normal Wi-Fi or mobile data, in Safari or Chrome rather than an in-app browser.</div>'
        + '<button class="btn btn-primary" style="margin-top:18px" onclick="location.reload()">Try again</button>'
        + '</div>';
    }
  }, 12000);
  window.addEventListener('error', e=>console.error('uncaught', e.message));
  window.addEventListener('unhandledrejection', e=>console.error('unhandled', e.reason));
  boot().then(()=>clearTimeout(bootWatch)).catch(e=>console.error('boot failed', e));
      };
      watch();   // if the connection recovers, the snapshot adopts the real board
      return;
    }
    state = loaded;
    const mirror = localMirror();
    if(!state) state = mirror;
    else if(boardScore(mirror) > boardScore(state)){
      // The server lost data this phone still has. Restore it rather than adopting the loss.
      state = mirror;
      restored = true;
    }
    if(!state) state = blank();
    if(!state.history) state.history = [];
    if(!state.feed) state.feed = [];
    if(!state.players) state.players = [];
    if(!state.weekStart) state.weekStart = mondayOf(today());
    myId = loadMe();
    if(fbError && !inClaude){
      banner = 'Can\u2019t reach the sync service \u2014 showing this phone\u2019s copy. Logs will send when it\u2019s back.';
    }
    if(restored){ banner = 'Restored the board from this phone \u2014 the server had lost it.'; await saveShared(); }
    if(touchSeen()) saveShared();
    rollIfNeeded(true);
    render();
    watch();
    if(restored) setTimeout(()=>{ banner=''; render(); }, 8000);
    setInterval(()=>{ if(rollIfNeeded(true)) render(); }, 60000);
  }
  // If boot never paints — an uncaught throw, a hung import — replace "Loading…" with
  // something actionable instead of leaving a dead screen.
  const bootWatch = setTimeout(()=>{
    const el = document.getElementById('app');
    if(el && el.querySelector('.boot')){
      el.innerHTML = '<div class="boot" style="text-align:left;padding:0 20px">'
        + '<div style="font-weight:800;font-size:20px;letter-spacing:-.02em">Couldn\u2019t start.</div>'
        + '<div style="font-size:13.5px;line-height:1.5;color:var(--color-neutral-800);margin-top:10px;max-width:34ch">'
        + 'Something blocked the app from loading \u2014 usually a network filter or a private-browsing window. '
        + 'Try again on normal Wi-Fi or mobile data, in Safari or Chrome rather than an in-app browser.</div>'
        + '<button class="btn btn-primary" style="margin-top:18px" onclick="location.reload()">Try again</button>'
        + '</div>';
    }
  }, 12000);
  window.addEventListener('error', e=>console.error('uncaught', e.message));
  window.addEventListener('unhandledrejection', e=>console.error('unhandled', e.reason));
  boot().then(()=>clearTimeout(bootWatch)).catch(e=>console.error('boot failed', e));

})();
</script>
